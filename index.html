<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zenith · fly higher with rarer answers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --amber:#ffb454; --coral:#ff7a59; --ink:#0a0c1c; --glass:rgba(10,12,28,.74);
  --line:rgba(255,255,255,.14); --dim:rgba(255,255,255,.62);
  --display:"Fraunces",Georgia,serif; --sans:"DM Sans",system-ui,sans-serif; --mono:"DM Mono",ui-monospace,Menlo,monospace;
  --base:64vh;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

#stage{position:fixed;inset:0;overflow:hidden}
#world{position:absolute;left:0;right:0;bottom:0;will-change:transform;
  transition:transform 1.9s cubic-bezier(.65,0,.35,1)}
#world.snap{transition:transform 1.1s cubic-bezier(.5,0,.2,1)}

/* stars */
#stars{position:absolute;inset:0;opacity:0;transition:opacity 1.9s ease;pointer-events:none}
#stars i{position:absolute;left:0;top:0;width:1.5px;height:1.5px;border-radius:50%;background:transparent}
#stars i:nth-child(1){animation:twinkle 3.2s ease-in-out infinite}
#stars i:nth-child(2){animation:twinkle 4.7s ease-in-out -2s infinite}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.35}}

/* ground */
#ground{position:absolute;left:0;right:0;bottom:0;height:var(--base);
  background:linear-gradient(#2c4a3e,#16261f 55%,#0c1512)}
#ground svg{position:absolute;left:0;bottom:100%;width:100%;height:90px;display:block;margin-bottom:-1px}
#pad{position:absolute;left:50%;top:-4px;width:96px;height:8px;margin-left:-48px;border-radius:3px;background:#0b100e;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
#pad::before,#pad::after{content:"";position:absolute;bottom:8px;width:3px;height:54px;background:linear-gradient(#55615c,#1a211e)}
#pad::before{left:6px}#pad::after{right:6px}

/* clouds */
.cloud{position:absolute;height:38px;border-radius:40px;background:rgba(255,255,255,.82);filter:blur(7px);
  animation:drift linear infinite alternate}
.cloud::before{content:"";position:absolute;left:18%;top:-45%;width:46%;height:120%;border-radius:50%;background:inherit}
@keyframes drift{from{transform:translateX(-40px)}to{transform:translateX(40px)}}

/* markers */
.mark{position:absolute;left:0;right:0;height:0;border-top:1px dashed rgba(255,255,255,.28)}
.mark span{position:absolute;top:-12px;font:500 11px/1 var(--mono);letter-spacing:.06em;white-space:nowrap;
  padding:6px 9px;border-radius:99px;background:rgba(8,10,24,.62);color:rgba(255,255,255,.9);backdrop-filter:blur(4px)}
.mark.l span{left:14px}.mark.r span{right:14px}
.mark.zone{border-top:1px solid rgba(255,180,84,.55)}
.mark.zone span{color:var(--amber);letter-spacing:.2em;text-transform:uppercase}
#moon{position:absolute;left:50%;width:240px;height:240px;margin-left:-120px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#fdfbf2,#d7d3c4 58%,#8f8c82);
  box-shadow:0 0 90px rgba(255,250,225,.4),inset -18px -22px 50px rgba(0,0,0,.35)}
#moon::before,#moon::after{content:"";position:absolute;border-radius:50%;background:rgba(0,0,0,.1);box-shadow:inset 3px 3px 6px rgba(0,0,0,.18)}
#moon::before{width:52px;height:52px;left:54px;top:70px}
#moon::after{width:30px;height:30px;left:140px;top:132px}

/* ship */
#ship{position:absolute;left:50%;bottom:var(--base);width:46px;margin-left:-23px;animation:bob 4s ease-in-out infinite;z-index:3}
#ship svg{display:block;width:100%;overflow:visible}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
#ship.pad{animation:none}
#flame{transform-origin:50% 0;transform-box:fill-box;transform:scaleY(.0);transition:transform .35s ease}
#ship.hover #flame{transform:scaleY(.42);animation:flick .13s linear infinite alternate}
#ship.burn #flame{transform:scaleY(1.25);animation:flickBig .09s linear infinite alternate}
#ship.burn{animation:rumble .09s linear infinite}
@keyframes flick{to{transform:scaleY(.52) scaleX(.9)}}
@keyframes flickBig{to{transform:scaleY(1.5) scaleX(.86)}}
@keyframes rumble{0%{transform:translate(-1px,0)}50%{transform:translate(1px,-1px)}100%{transform:translate(0,1px)}}
#ship.stall{animation:stall .5s ease}
@keyframes stall{20%{transform:translate(-6px,4px) rotate(-7deg)}55%{transform:translate(5px,8px) rotate(6deg)}100%{transform:none}}

#streaks{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s}
#streaks.on{opacity:1}
#streaks i{position:absolute;top:-20%;width:1.5px;height:90px;background:linear-gradient(transparent,rgba(255,255,255,.55));animation:fall .55s linear infinite}
@keyframes fall{to{transform:translateY(140vh)}}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;
  padding:max(14px,env(safe-area-inset-top)) 16px 0;pointer-events:none;opacity:0;transform:translateY(-12px);transition:.6s ease}
#hud.on{opacity:1;transform:none}
.chip{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:9px 13px;backdrop-filter:blur(10px);min-width:108px}
.chip small{display:block;font:500 9.5px/1 var(--mono);letter-spacing:.2em;color:var(--dim);margin-bottom:6px}
.chip b{font:600 20px/1 var(--display);font-variant-numeric:tabular-nums}
.chip em{display:block;font:500 10px/1 var(--mono);font-style:normal;color:var(--amber);margin-top:6px;letter-spacing:.1em;text-transform:uppercase}
.chip.right{text-align:right}
#pips{display:flex;gap:6px;margin-top:14px}
#pips i{width:9px;height:9px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);background:rgba(8,10,24,.4);transition:.4s}
#pips i.hit{background:var(--amber);border-color:var(--amber);box-shadow:0 0 10px var(--amber)}
#pips i.miss{background:rgba(255,255,255,.25);border-color:rgba(255,255,255,.3)}
#pips i.now{transform:scale(1.35);border-color:#fff}

/* panel */
#panel{position:absolute;left:50%;bottom:max(16px,env(safe-area-inset-bottom));width:min(560px,calc(100% - 24px));transform:translateX(-50%);z-index:6;
  background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:22px 22px 20px;backdrop-filter:blur(16px);
  box-shadow:0 24px 70px rgba(0,0,0,.5)}
.view{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.eyebrow{font:500 10.5px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--amber)}
h1{font:800 clamp(44px,11vw,64px)/.95 var(--display);letter-spacing:-.03em;margin:10px 0 10px}
h1 span{display:inline-block;animation:letter .8s cubic-bezier(.2,.9,.2,1) both}
@keyframes letter{from{opacity:0;transform:translateY(26px) rotate(6deg)}}
h2{font:600 clamp(24px,6vw,31px)/1.12 var(--display);letter-spacing:-.015em;margin:10px 0 16px}
p{color:var(--dim);font-size:14.5px;line-height:1.5}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:18px;padding:15px 18px;border-radius:14px;
  background:linear-gradient(135deg,var(--amber),var(--coral));color:#1b0e04;font-weight:700;font-size:15.5px;letter-spacing:.02em;
  transition:transform .15s,box-shadow .2s,opacity .3s;box-shadow:0 8px 26px rgba(255,122,89,.35)}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(255,122,89,.5)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn kbd{font:500 11px var(--mono);padding:3px 6px;border-radius:5px;background:rgba(0,0,0,.16)}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.rules div{border:1px solid var(--line);border-radius:12px;padding:10px;font:500 11px/1.35 var(--mono);color:var(--dim)}
.rules b{display:block;font:600 19px/1 var(--display);color:#fff;margin-bottom:5px}

.timer{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:5px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--coral),var(--amber));transform-origin:0 50%;border-radius:9px}
.secs{font:500 13px/1 var(--mono);font-variant-numeric:tabular-nums;min-width:30px;text-align:right}
.timer.low .secs{color:var(--coral);animation:pulse .5s ease infinite alternate}
@keyframes pulse{to{transform:scale(1.18)}}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;font:500 17px var(--sans);color:#fff;padding:14px 16px;border-radius:14px;outline:0;
  background:rgba(255,255,255,.07);border:1.5px solid var(--line);transition:border-color .2s,box-shadow .2s}
.field input:focus{border-color:var(--amber);box-shadow:0 0 0 4px rgba(255,180,84,.16)}
.field input::placeholder{color:rgba(255,255,255,.35)}
.field button{padding:0 18px;border-radius:14px;background:#fff;color:#111;font-weight:700}
.field.shake{animation:shake .38s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.hint{min-height:18px;margin-top:9px;font:500 11.5px/1.4 var(--mono);color:var(--dim)}
.hint.bad{color:#ff9d86}

.said{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:10px 0 14px}
.said h2{margin:0;text-transform:capitalize;overflow-wrap:anywhere}
.pts{font:800 34px/1 var(--display);color:var(--amber);font-variant-numeric:tabular-nums;white-space:nowrap;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.pts.zero{color:rgba(255,255,255,.4)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.meter{position:relative;height:8px;border-radius:9px;background:linear-gradient(90deg,#4a5578,#8d7bd6 45%,var(--coral) 78%,var(--amber))}
.meter i{position:absolute;top:50%;left:0;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fff;
  box-shadow:0 0 0 4px rgba(255,255,255,.2),0 4px 12px rgba(0,0,0,.5);transition:left 1.3s cubic-bezier(.2,.9,.2,1) .15s}
.ends{display:flex;justify-content:space-between;font:500 9.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:10px}
.facts{margin-top:14px;font-size:13.5px;line-height:1.6;color:var(--dim)}
.facts b{color:#fff;font-weight:500;text-transform:capitalize}

.big{font:800 clamp(40px,10vw,56px)/1 var(--display);letter-spacing:-.03em;margin:8px 0 4px;font-variant-numeric:tabular-nums}
.rows{margin-top:14px;max-height:30vh;overflow:auto;border-top:1px solid var(--line)}
.rows div{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;
  animation:rise .5s both}
.rows q{quotes:none;color:var(--dim);grid-column:1}
.rows b{grid-column:1;font-weight:500;text-transform:capitalize}
.rows u{grid-row:1/3;grid-column:2;align-self:center;text-decoration:none;font:600 17px var(--display);color:var(--amber);font-variant-numeric:tabular-nums}
.rows .nil b,.rows .nil u{color:rgba(255,255,255,.38)}
.best{margin-top:10px;font:500 11px var(--mono);letter-spacing:.1em;color:var(--dim)}

@media (max-height:640px){#panel{padding:16px 18px 14px}h2{margin:8px 0 12px}.rules{display:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}#world{transition-duration:.3s}}
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="moon"></div>
    <div id="ground">
      <svg viewBox="0 0 1200 90" preserveAspectRatio="none"><path fill="#2c4a3e" d="M0 90V52c120-34 230-30 340-6s190 34 300 4 210-52 330-26 160 30 230 14V90z"/></svg>
      <div id="pad"></div>
    </div>
  </div>
  <div id="stars"><i></i><i></i></div>
  <div id="streaks"></div>
  <div id="ship" class="pad">
    <svg viewBox="0 0 46 84">
      <path id="flame" d="M15 62h16l-8 40z" fill="url(#fl)"/>
      <path d="M6 60l9-16v18zM40 60l-9-16v18z" fill="#ff7a59"/>
      <path d="M23 0c10 12 13 26 13 40v22H10V40C10 26 13 12 23 0z" fill="#f6f1e7"/>
      <path d="M23 0c5 6 8 12 10 19H13c2-7 5-13 10-19z" fill="#ff7a59"/>
      <circle cx="23" cy="34" r="6.5" fill="#12203f" stroke="#ffb454" stroke-width="2.5"/>
      <rect x="10" y="56" width="26" height="6" fill="#cfc8ba"/>
      <defs><linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6d6"/><stop offset=".4" stop-color="#ffb454"/><stop offset="1" stop-color="#ff5a3c" stop-opacity="0"/></linearGradient></defs>
    </svg>
  </div>

  <div id="hud">
    <div class="chip"><small>ALTITUDE</small><b id="alt">0 m</b><em id="zone">Launch pad</em></div>
    <div id="pips"></div>
    <div class="chip right"><small>SCORE</small><b id="score">0</b><em id="round">&nbsp;</em></div>
  </div>

  <div id="panel"></div>
</div>

const BANK = [

/* ---------- constants ---------- */
const ROUNDS=7, SECS=25, MAX=ROUNDS*1000, PX=0.8, L=Math.log10(384401);
const altOf=s=>Math.pow(10,s/MAX*L)-1, sOf=a=>MAX*Math.log10(a+1)/L;
const $=id=>document.getElementById(id);
const world=$("world"), panel=$("panel"), ship=$("ship"), stars=$("stars"), streaks=$("streaks");

const ZONES=[[0,"Troposphere"],[12,"Stratosphere"],[50,"Mesosphere"],[85,"Thermosphere"],[600,"Exosphere"],[10000,"Deep space"],[300000,"Lunar approach"]];
const MARKS=[[.83,"tallest building on Earth — 828 m"],[4.8,"Mont Blanc summit"],[8.85,"Mount Everest — 8,849 m"],[11,"airliners cruise here"],
[21,"the sky turns black overhead"],[41.4,"highest skydive ever — 41.4 km"],[82,"night-shining clouds"],[100,"the Kármán line — space begins"],
[408,"International Space Station"],[547,"Hubble Space Telescope"],[2000,"end of low Earth orbit"],[20200,"GPS satellites"],
[35786,"geostationary orbit"],[150000,"Earth is a blue marble behind you"],[384400,"the Moon — a perfect flight ends here"]];

/* ---------- build the world ---------- */
const y=s=>`calc(var(--base) + ${Math.round(s*PX)}px)`;
world.style.height=`calc(var(--base) + ${MAX*PX}px + 75vh)`;
const SKY=[[0,"#ffd7a3"],[350,"#f7a98b"],[800,"#86b8f2"],[1400,"#3b6fd1"],[2100,"#182a6b"],[2800,"#0a0f2e"],[3600,"#04050f"],[7000,"#000"]];
world.style.background=`linear-gradient(to top,#ffd7a3 0,${SKY.map(([s,c])=>`${c} ${y(s)}`).join(",")})`;
ZONES.slice(1).forEach(([a,name])=>addMark(sOf(a),name,"zone "+"l"));
MARKS.forEach(([a,t],i)=>addMark(sOf(a),t,i%2?"l":"r"));
function addMark(s,text,cls){const d=document.createElement("div");d.className="mark "+cls;d.style.bottom=y(s);d.innerHTML=`<span>${cls.includes("r")?text+" ──":"── "+text}</span>`;world.appendChild(d)}
$("moon").style.bottom=y(MAX+40);
for(let i=0;i<14;i++){const c=document.createElement("div");c.className="cloud";const w=90+Math.random()*170;
  c.style.cssText=`width:${w}px;left:${Math.random()*100-8}%;bottom:${y(120+Math.random()*1250)};opacity:${.35+Math.random()*.5};animation-duration:${9+Math.random()*14}s`;world.appendChild(c)}
[...stars.children].forEach((el,k)=>{let sh=[];for(let i=0;i<110;i++){const a=(.35+Math.random()*.65).toFixed(2);
  sh.push(`${(Math.random()*100).toFixed(1)}vw ${(Math.random()*100).toFixed(1)}vh 0 ${Math.random()<.12?1:0}px rgba(255,255,${k?255:225},${a})`)}el.style.boxShadow=sh.join(",")});
for(let i=0;i<16;i++){const s=document.createElement("i");s.style.cssText=`left:${Math.random()*100}%;animation-delay:${-Math.random()*.6}s;animation-duration:${.4+Math.random()*.4}s;height:${50+Math.random()*90}px`;streaks.appendChild(s)}

/* ---------- answer matching ---------- */
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/&/g,"and").replace(/['’.]/g,"")
  .replace(/[^a-z0-9]+/g," ").trim().replace(/^(the|a|an|mount|mt) /,"").replace(/ /g,"");
const forms=k=>[k,k.replace(/s$/,""),k.replace(/es$/,"")].filter(x=>x.length>1||x===k);
function lev(a,b,max){if(Math.abs(a.length-b.length)>max)return 99;let p=[...Array(b.length+1).keys()];
  for(let i=1;i<=a.length;i++){let c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]!==b[j-1]));p=c}return p[b.length]}
function index(p){if(p.map)return p.map;p.map=new Map();p.answers.forEach((al,i)=>al.forEach(a=>forms(norm(a)).forEach(f=>{if(!p.map.has(f))p.map.set(f,i)})));return p.map}
function match(p,raw){const m=index(p),k=norm(raw);if(!k)return -1;
  for(const f of forms(k))if(m.has(f))return m.get(f);
  const tol=k.length>=9?2:k.length>=5?1:0;if(!tol)return -1;
  let best=-1,bd=99;for(const [key,i] of m){if(key[0]!==k[0])continue;const d=lev(k,key,tol);if(d<=tol&&d<bd){bd=d;best=i}}return best}
const pointsFor=(i,n)=>Math.round(150+850*Math.pow(i/(n-1),1.15));
function share(i,n){let h=0;for(let k=1;k<=n;k++)h+=1/k;return 100/((i+1)*h)}

/* ---------- storage (optional) ---------- */
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
function drawPrompts(){let seen=new Set(store.get("zenith.seen",[]));let pool=BANK.filter(p=>!seen.has(p.q));
  if(pool.length<ROUNDS){seen=new Set();pool=BANK.slice()}
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const pick=pool.slice(0,ROUNDS);pick.forEach(p=>seen.add(p.q));store.set("zenith.seen",[...seen]);return pick}

/* ---------- HUD + camera ---------- */
let G=null, shown=0, raf=0, tick=0;
const fmtAlt=a=>a<1?Math.round(a*1000)+" m":a<100?a.toFixed(1)+" km":Math.round(a).toLocaleString("en-US")+" km";
const zoneOf=a=>a<.005?"Launch pad":ZONES.filter(z=>a>=z[0]).pop()[1];
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function paintHud(s){const a=altOf(s);$("alt").textContent=fmtAlt(a);$("zone").textContent=zoneOf(a);$("score").textContent=Math.round(s).toLocaleString("en-US")}
function flyTo(s,ms=1900,snap=false){world.classList.toggle("snap",snap);world.style.transform=`translateY(${s*PX}px)`;
  stars.style.opacity=Math.max(0,Math.min(1,(s-1500)/1200));
  const from=shown,t0=performance.now();cancelAnimationFrame(raf);
  (function step(now){const t=Math.min(1,(now-t0)/ms);shown=from+(s-from)*ease(t);paintHud(shown);if(t<1)raf=requestAnimationFrame(step)})(t0)}
function pips(){$("pips").innerHTML=G.prompts.map((_,i)=>{const r=G.results[i];return `<i class="${r?(r.pts?"hit":"miss"):i===G.round?"now":""}"></i>`}).join("")}

/* ---------- screens ---------- */
function view(html){panel.innerHTML=`<div class="view">${html}</div>`}
function intro(){
  $("hud").classList.remove("on");ship.className="pad";
  const best=store.get("zenith.best",0);
  view(`<div class="eyebrow">A game of uncommon answers</div>
  <h1>${[..."Zenith"].map((c,i)=>`<span style="animation-delay:${i*70}ms">${c}</span>`).join("")}</h1>
  <p>Seven prompts. Answer each with something true — but the <b style="color:#fff">less obvious</b> your answer, the harder the engines burn. A perfect flight reaches the Moon.</p>
  <div class="rules"><div><b>7</b>prompts per flight</div><div><b>${SECS}s</b>on every clock</div><div><b>∞</b>flights, new prompts each time</div></div>
  <button class="btn" id="go">Launch <kbd>↵</kbd></button>
  ${best?`<div class="best">BEST FLIGHT · ${fmtAlt(altOf(best)).toUpperCase()} · ${best.toLocaleString("en-US")} PTS</div>`:""}`);
  $("go").onclick=start;$("go").focus();
}
function start(){
  G={prompts:drawPrompts(),round:0,score:0,results:[]};
  $("hud").classList.add("on");shown=0;flyTo(0,700,true);ship.className="hover";ask();
}
/* ---------- AI judge for answers that aren't on the built-in list ---------- */
const JUDGE_URL="";
const judged=new Map();
async function judge(p,v){
  if(!JUDGE_URL)return null;const key=p.q+"|"+norm(v);if(judged.has(key))return judged.get(key);
  try{const c=new AbortController(),t=setTimeout(()=>c.abort(),9000);
    const r=await fetch(JUDGE_URL,{method:"POST",headers:{"Content-Type":"application/json"},signal:c.signal,
      body:JSON.stringify({prompt:p.q,answer:v,common:p.answers.slice(0,4).map(a=>a[0]),rare:p.answers.slice(-4).map(a=>a[0])})});
    clearTimeout(t);if(!r.ok)return null;const j=await r.json();if(typeof j.valid!=="boolean")return null;judged.set(key,j);return j;
  }catch{return null}
}
function ask(){
  const p=G.prompts[G.round],n=p.answers.length;pips();$("round").textContent=`Prompt ${G.round+1} / ${ROUNDS}`;
  view(`<div class="timer"><div class="bar"><i id="bar"></i></div><div class="secs" id="secs">${SECS}</div></div>
  <h2>${p.q}</h2>
  <form class="field" id="f" autocomplete="off"><input id="in" placeholder="Type an answer…" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send"><button>Send</button></form>
  <div class="hint" id="hint">Obvious answers barely lift off. Dig deeper.</div>`);
  const input=$("in");let left=SECS*1000,last=performance.now(),busy=false,done=false;input.focus();
  const hint=(t,bad)=>{const h=$("hint");if(!h)return;h.className="hint"+(bad?" bad":"");h.textContent=t};
  async function submit(final){
    if(busy||done)return;const v=input.value.trim();
    if(!v){if(final){done=true;resolve(p,null,"")}return}
    const i=match(p,v);
    if(i>=0){done=true;return resolve(p,{name:p.answers[i][0],frac:i/(n-1),pct:share(i,n)},v)}
    busy=true;input.disabled=true;hint("The judge is thinking…");   // the clock is paused while the AI decides
    const j=await judge(p,v);busy=false;last=performance.now();
    if(j&&j.valid){done=true;return resolve(p,{name:j.name||v,frac:j.rarity/100,ai:true,rarity:j.rarity},v)}
    if(final){done=true;return resolve(p,null,v)}
    input.disabled=false;input.focus();input.select();
    const f=$("f");f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake");
    hint(j?`The judge says “${v}” doesn't fit — try another.`:`“${v}” isn't on the list — try something else.`,true);
  }
  $("f").onsubmit=e=>{e.preventDefault();submit(false)};
  cancelAnimationFrame(tick);
  (function loop(now){const b=$("bar");if(!b||done)return;
    if(!busy)left-=now-last;last=now;left=Math.max(0,left);
    b.style.transform=`scaleX(${left/(SECS*1000)})`;$("secs").textContent=Math.ceil(left/1000);
    b.parentNode.parentNode.classList.toggle("low",left<6000);
    if(left<=0&&!busy)submit(true);
    tick=requestAnimationFrame(loop)})(performance.now());
}
function resolve(p,res,typed){
  cancelAnimationFrame(tick);
  const n=p.answers.length,hit=!!res,f=hit?Math.max(0,Math.min(1,res.frac)):0;
  const pts=hit?Math.round(150+850*Math.pow(f,1.15)):0,name=hit?res.name:(typed||"");
  G.results[G.round]={q:p.q,name,pts};G.score+=pts;pips();
  const last=G.round===ROUNDS-1;
  const verdict=!hit?"":f<.1?"The crowd favourite.":f<.35?"A safe pick.":f<.7?"Nicely off the beaten path.":"Almost nobody goes there.";
  const why=!hit?"":res.ai?`The AI judge accepted this and rated its rarity <b>${res.rarity}/100</b>. `
    :`Roughly <b>${res.pct<1?res.pct.toFixed(1):Math.round(res.pct)}%</b> of people would say this. `;
  view(`<div class="eyebrow">${hit?verdict:typed?"Didn't count":"Out of time"}</div>
  <div class="said"><h2>${hit?esc(name):typed?esc(typed):"No answer"}</h2><div class="pts ${pts?"":"zero"}" id="pts">+0</div></div>
  <div class="meter"><i id="dot"></i></div><div class="ends"><span>Everyone says it</span><span>Nobody says it</span></div>
  <div class="facts">${why}Most common: <b>${p.answers[0][0]}</b>. Rarest we had: <b>${p.answers[n-1][0]}</b>.</div>
  <button class="btn" id="next" disabled>${last?"See your flight":"Next prompt"} <kbd>↵</kbd></button>`);
  requestAnimationFrame(()=>{if(!$("dot"))return;if(hit)$("dot").style.left=(f*100)+"%";else $("dot").style.opacity=.25});
  if(hit){const t0=performance.now();(function up(now){const t=Math.min(1,(now-t0)/1100),el=$("pts");if(!el)return;el.textContent="+"+Math.round(pts*ease(t));if(t<1)requestAnimationFrame(up)})(t0);
    ship.className="burn";streaks.classList.add("on");flyTo(G.score);
    setTimeout(()=>{ship.className="hover";streaks.classList.remove("on")},1900);
  }else{ship.className="hover stall";setTimeout(()=>ship.className="hover",550)}
  const btn=$("next");setTimeout(()=>{btn.disabled=false;btn.focus()},hit?900:500);
  btn.onclick=()=>{G.round++;last?summary():ask()};
}
function summary(){
  pips();$("round").innerHTML="&nbsp;";
  const best=store.get("zenith.best",0),record=G.score>best;if(record)store.set("zenith.best",G.score);
  const a=altOf(G.score),passed=MARKS.filter(m=>m[0]<=a).pop();
  view(`<div class="eyebrow">${record&&best?"New personal best":"Flight complete"}</div>
  <div class="big">${fmtAlt(a)}</div>
  <p>${G.score.toLocaleString("en-US")} of ${MAX.toLocaleString("en-US")} points · ${zoneOf(a)}${passed?` · you cleared “${passed[1]}”`:""}</p>
  <div class="rows">${G.results.map((r,i)=>`<div class="${r.pts?"":"nil"}" style="animation-delay:${i*60}ms"><q>${r.q}</q><b>${r.name?esc(r.name):"—"}</b><u>${r.pts?"+"+r.pts:"0"}</u></div>`).join("")}</div>
  <button class="btn" id="again">Fly again — new prompts <kbd>↵</kbd></button>
  <div class="best">BEST · ${Math.max(best,G.score).toLocaleString("en-US")} PTS</div>`);
  $("again").onclick=start;$("again").focus();
}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
intro();
</script>
</body>
